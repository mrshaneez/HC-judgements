<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Maldives Judgments — Search</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a2733;--muted:#5c6b7a;--accent:#1F3B57;--line:#e3e8ee;--hi:#2f6fb0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 70px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.adminlink{font-size:.85rem;color:var(--hi);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;white-space:nowrap}
.adminlink:hover{background:#f0f5fa}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat b{display:block;font-size:1.3rem;color:var(--accent)}
.stat span{font-size:.75rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=search],select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;background:#fff;color:var(--ink)}
input[type=search]{flex:1;min-width:220px}
.count{color:var(--muted);font-size:.85rem;margin:6px 2px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.9rem}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--accent);color:#fff;white-space:nowrap;font-size:.8rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f0f5fa}
.thaana{font-family:"MV Faseyha","MV Boli","A_Faruma",Arial;direction:rtl;unicode-bidi:isolate}
.pj{font-weight:600}
.snip{color:#33424f;font-size:.85rem;margin-top:5px;background:#f4f7fb;border-radius:6px;padding:6px 9px;white-space:pre-wrap;direction:rtl;unicode-bidi:plaintext}
.snip mark{background:#ffe58a;padding:0 1px}
.badge{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:20px;white-space:nowrap}
.b-text{background:#e6f0e6;color:#2f6b2f}.b-high{background:#e5eefb;color:#1f4e8f}.b-med{background:#fdf3e0;color:#9a6a1a}
.b-manual{background:#efe7fb;color:#5b3ca8}.b-review{background:#fdeedd;color:#a85b12}.b-unres{background:#fce4e4;color:#a33}
.act{white-space:nowrap;display:flex;gap:6px}
.btn{font:inherit;font-size:.8rem;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;color:var(--ink);text-decoration:none}
.btn:hover{background:#eef4fb}
.btn[disabled]{opacity:.4;cursor:default}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0}
.loading{padding:40px;text-align:center;color:var(--muted)}
/* reader modal */
.overlay{position:fixed;inset:0;background:rgba(20,30,40,.5);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px;margin-top:3vh}
.modal h3{margin:0 0 4px}
.modal .meta{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.reader{white-space:pre-wrap;direction:rtl;unicode-bidi:plaintext;font-family:"MV Faseyha","MV Boli",Arial;font-size:1.05rem;line-height:1.9;background:#fbfcfe;border:1px solid var(--line);border-radius:8px;padding:14px;max-height:62vh;overflow:auto;user-select:text}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media (max-width:760px){.bench,.disp{display:none}}
</style>
</head>
<body><div class="wrap">
<div class="topbar">
  <div>
    <h1>Maldives Judgments — Search</h1>
    <p class="sub">Search High Court judgments by keyword, principle, name, judge, year or type. Click <b>Read</b> to view and copy the text, or <b>View</b> for the original PDF.</p>
  </div>
  <a class="adminlink" href="/admin">Admin</a>
</div>
<div class="cards" id="stats"></div>
<div class="controls">
  <input type="search" id="q" placeholder="Search text, principles, names, keywords… (English or ދިވެހި)" />
  <select id="fyear"><option value="">All years</option></select>
  <select id="ftype"><option value="">All types</option></select>
  <select id="fjudge"><option value="">All judges</option></select>
  <select id="fsource"><option value="">All sources</option>
    <option value="text">Judgment text</option><option value="OCR-high">OCR · high</option>
    <option value="OCR-med">OCR · med</option><option value="manual">Manual</option>
    <option value="needs-review">Needs review</option></select>
</div>
<div class="count" id="count"></div>
<div id="tablewrap"><div class="loading">Loading…</div></div>
<div class="pager" id="pager"></div>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <h3 id="rTitle"></h3>
  <div class="meta" id="rMeta"></div>
  <div class="reader" id="rBody"></div>
  <div class="foot">
    <a class="btn" id="rView" target="_blank" rel="noopener">View original ↗</a>
    <button class="btn" id="rCopy">Copy text</button>
    <button class="btn" id="rClose">Close</button>
  </div>
</div></div>

<script>
const SRC={'text':['Judgment text','b-text'],'OCR-high':['OCR·high','b-high'],'OCR-med':['OCR·med','b-med'],'manual':['Manual','b-manual'],'needs-review':['Needs review','b-review'],'unresolved':['Unresolved','b-unres']};
const TYPE={'A':'Appeal (HC-A)','B':'Misc (HC-B)'};
let state={q:'',year:'',type:'',judge:'',source:'',page:1,pageSize:50,total:0};
const $=id=>document.getElementById(id);
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function badge(s){const b=SRC[s]||[s||'—','b-text'];return `<span class="badge ${b[1]}">${esc(b[0])}</span>`;}
function hl(text,q){let t=esc(text);if(q){const rx=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');t=t.replace(rx,'<mark>$1</mark>');}return t;}

async function loadMeta(){
  const m=await (await fetch('/api/meta')).json();
  const y=$('fyear');(m.years||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;y.appendChild(o);});
  const t=$('ftype');(m.types||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=TYPE[v]||('HC-'+v);t.appendChild(o);});
  const j=$('fjudge');(m.judges||[]).forEach(v=>{const o=document.createElement('option');o.value=v.name_en;o.textContent=(v.count!=null)?`${v.name_en} (${v.count})`:v.name_en;j.appendChild(o);});
  $('stats').innerHTML=
    `<div class="stat"><b>${m.total??'—'}</b><span>Judgments</span></div>`+
    `<div class="stat"><b>${m.withText??'—'}</b><span>Full-text searchable</span></div>`+
    `<div class="stat"><b>${(m.judges||[]).length}</b><span>Judges</span></div>`+
    `<div class="stat"><b>${(m.years||[]).length}</b><span>Years</span></div>`;
}
function qs(){const p=new URLSearchParams();p.set('page',state.page);p.set('pageSize',state.pageSize);
  if(state.q)p.set('q',state.q);if(state.year)p.set('year',state.year);if(state.type)p.set('type',state.type);
  if(state.judge)p.set('judge',state.judge);if(state.source)p.set('source',state.source);return p.toString();}
async function load(){
  $('tablewrap').innerHTML='<div class="loading">Loading…</div>';
  const r=await (await fetch('/api/cases?'+qs())).json();
  state.total=r.total||0;render(r.cases||[]);renderPager();
}
function render(rows){
  if(!rows.length){$('tablewrap').innerHTML='<div class="loading">No matching judgments.</div>';$('count').textContent='0 results';return;}
  const head=`<table><thead><tr><th>Case No</th><th>Date</th><th>Type</th><th>Presiding</th><th class="bench">Bench</th><th>Source</th><th></th></tr></thead><tbody>`;
  const body=rows.map(x=>{
    const snip=(state.q&&x.snippet)?`<div class="snip">…${hl(x.snippet,state.q)}…</div>`:'';
    const read=x.has_text?`<button class="btn" data-read="${x.id}">Read</button>`:'';
    const view=x.pdf_url?`<a class="btn" href="${esc(x.pdf_url)}" target="_blank" rel="noopener">View ↗</a>`:'';
    return `<tr><td>${esc(x.caseno)}${snip}</td><td>${esc(x.date_concluded)}</td>
      <td>${esc(x.case_type||'')}</td><td class="pj">${esc(x.presiding_en)}</td>
      <td class="bench">${esc(x.bench)}</td><td>${badge(x.source)}</td>
      <td class="act">${read}${view}</td></tr>`;
  }).join('');
  $('tablewrap').innerHTML=head+body+'</tbody></table>';
  $('count').textContent=state.judge?`${state.total} case${state.total===1?'':'s'} concluded by ${state.judge}`:`${state.total} result${state.total===1?'':'s'}`;
  document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>openReader(b.dataset.read));
}
function renderPager(){
  const pages=Math.max(1,Math.ceil(state.total/state.pageSize));
  $('pager').innerHTML=`<button class="btn" id="prev" ${state.page<=1?'disabled':''}>‹ Prev</button>
    <span class="count">Page ${state.page} of ${pages}</span>
    <button class="btn" id="next" ${state.page>=pages?'disabled':''}>Next ›</button>`;
  if($('prev'))$('prev').onclick=()=>{if(state.page>1){state.page--;load();window.scrollTo(0,0);}};
  if($('next'))$('next').onclick=()=>{const p=Math.ceil(state.total/state.pageSize);if(state.page<p){state.page++;load();window.scrollTo(0,0);}};
}
async function openReader(id){
  const j=await (await fetch('/api/cases?id='+encodeURIComponent(id))).json();
  const c=j.case;if(!c)return;
  $('rTitle').textContent=c.caseno;
  $('rMeta').innerHTML=`${esc(c.date_concluded||'')} · ${esc(c.presiding_en||'')} ${c.bench?('· '+esc(c.bench)):''}`;
  $('rBody').textContent=c.full_text||'No text available for this judgment (scanned image). Use “View original”.';
  $('rView').href=c.pdf_url||'#';$('rView').style.display=c.pdf_url?'':'none';
  $('rCopy').onclick=async()=>{try{await navigator.clipboard.writeText(c.full_text||'');$('rCopy').textContent='Copied!';setTimeout(()=>$('rCopy').textContent='Copy text',1500);}catch(e){}};
  $('overlay').classList.add('open');
}
$('rClose').onclick=()=>$('overlay').classList.remove('open');
$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open');};

let t;
$('q').oninput=()=>{clearTimeout(t);t=setTimeout(()=>{state.q=$('q').value.trim();state.page=1;load();},350);};
['fyear','ftype','fjudge','fsource'].forEach(id=>$(id).onchange=()=>{
  state.year=$('fyear').value;state.type=$('ftype').value;state.judge=$('fjudge').value;state.source=$('fsource').value;
  state.page=1;load();
});
loadMeta();load();
</script>
</body></html>
